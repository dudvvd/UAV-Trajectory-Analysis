[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-trajectory"
version = "0.1.0"
description = "Classical computer-vision UAV trajectory estimation from adjacent IR images."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<3.0",
  "opencv-python>=4.8,<5.0",
  "matplotlib>=3.7,<4.0",
  "scipy>=1.11,<2.0",
  "tqdm>=4.66,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "utils*"]
